name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/windows.yml
    with:
      package: true

  publish:
    name: Publish experimental Windows release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-package
          path: release

      - name: Check downloaded package checksum
        working-directory: release
        run: sha256sum --check ShadowMMA-Windows-x64.zip.sha256

      - name: Create prerelease with the tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/ShadowMMA-Windows-x64.zip \
            release/ShadowMMA-Windows-x64.zip.sha256 \
            --repo "$GH_REPO" --verify-tag --prerelease \
            --title "ShadowMMA $RELEASE_TAG (experimental)" \
            --notes-file release/RELEASE_NOTES.md
